<div class="bg-white rounded-xl shadow-lg p-6 mt-12">
  <!-- Comments Heading -->
  <div class="flex items-center space-x-2 mb-6">
    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.77 9.77 0 01-4-.8l-4 1 1-3.6A7.975 7.975 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
    </svg>
    <h3 class="text-xl font-bold text-gray-900">Comments (3)</h3>
  </div>

  <!-- Comment Form -->
  <form action="#" method="post" class="mb-8 p-6 bg-gray-50 rounded-xl">
    <h4 class="text-lg font-semibold text-gray-900 mb-4">Leave a Comment</h4>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Name *</label>
        <input
          type="text"
          name="author"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
        <input
          type="email"
          name="email"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Comment *</label>
      <textarea
        name="comment"
        rows="4"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none"
        placeholder="Share your thoughts..."></textarea>
    </div>
    <button
      type="submit"
      class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors font-medium">
      Post Comment
    </button>
  </form>

  <!-- Comments List (loop through WP comments) -->
  <div class="space-y-6">
    <div class="border-b border-gray-200 pb-6">
      <div class="flex items-start space-x-4">
        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
          <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M5.121 17.804A13.937 13.937 0 0112 15c2.5 0 4.847.655 6.879 1.804M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>
        <div class="flex-1">
          <div class="flex items-center space-x-2 mb-2">
            <h5 class="font-semibold text-gray-900">John Doe</h5>
            <span class="text-sm text-gray-500">July 25, 2025</span>
          </div>
          <p class="text-gray-700 leading-relaxed">
            Great article! This really helped me understand the concepts better.
          </p>
        </div>
      </div>
    </div>
    <!-- Repeat for more comments -->
  </div>
</div>
