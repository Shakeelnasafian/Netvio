<aside class="w-full lg:w-80 space-y-8">
  <!-- Search Box -->
  <div class="bg-white rounded-xl shadow-lg p-6">
    <h3 class="text-lg font-bold text-gray-900 mb-4">Search Blog</h3>
    <form action="/blog/search" method="get" class="relative">
      <input
        type="text"
        name="s"
        placeholder="Search articles..."
        class="w-full pl-4 pr-12 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
      />
      <button
        type="submit"
        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-blue-600 transition-colors"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
        </svg>
      </button>
    </form>
  </div>

  <!-- Categories -->
  <div class="bg-white rounded-xl shadow-lg p-6">
    <h3 class="text-lg font-bold text-gray-900 mb-4">Categories</h3>
    <ul class="space-y-2">
      <!-- Example loop -->
      <li>
        <a href="/blog/category/category-slug"
          class="flex items-center justify-between py-2 px-3 rounded-lg hover:bg-gray-50 transition-colors group">
          <span class="text-gray-700 group-hover:text-blue-600">Category Name</span>
          <div class="flex items-center space-x-2">
            <span class="text-sm text-gray-500">(5)</span>
            <svg class="w-4 h-4 text-gray-400 group-hover:text-blue-600" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5l7 7-7 7" />
            </svg>
          </div>
        </a>
      </li>
      <!-- Repeat for other categories -->
    </ul>
  </div>

  <!-- Recent Posts -->
  <div class="bg-white rounded-xl shadow-lg p-6">
    <h3 class="text-lg font-bold text-gray-900 mb-4">Recent Posts</h3>
    <div class="space-y-4">
      <!-- Example loop -->
      <article class="flex space-x-3">
        <img
          src="https://via.placeholder.com/80"
          alt="Post Title"
          class="w-16 h-16 rounded-lg object-cover flex-shrink-0"
        />
        <div class="flex-1 min-w-0">
          <a href="/blog/post-slug"
            class="text-sm font-medium text-gray-900 hover:text-blue-600 line-clamp-2 transition-colors">
            Post Title Example Goes Here
          </a>
          <p class="text-xs text-gray-500 mt-1">July 26, 2025</p>
        </div>
      </article>
      <!-- Repeat for other posts -->
    </div>
  </div>

  <!-- Newsletter Signup -->
  <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl shadow-lg p-6 text-white">
    <div class="flex items-center space-x-2 mb-4">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 12H8m8 4H8m2-8h6a2 2 0 012 2v8a2 2 0 01-2 2H8a2 2 0 01-2-2V8a2 2 0 012-2h6" />
      </svg>
      <h3 class="text-lg font-bold">Stay Updated</h3>
    </div>
    <p class="text-blue-100 mb-4 text-sm">
      Get the latest insights and trends delivered to your inbox.
    </p>
    <form action="#" method="post" class="space-y-3">
      <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required
        class="w-full px-4 py-3 rounded-lg text-gray-900 placeholder-gray-500 focus:ring-2 focus:ring-white focus:ring-opacity-50 outline-none"
      />
      <button
        type="submit"
        class="w-full bg-white text-blue-600 font-medium py-3 rounded-lg hover:bg-gray-50 transition-colors"
      >
        Subscribe Now
      </button>
    </form>
  </div>
</aside>
